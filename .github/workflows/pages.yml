name: TKA design-system showcase

on:
  pull_request:
    paths:
      - "showcase/**"
      - "scripts/build-showcase.mjs"
      - "documents/src/renderers.mjs"
      - "panda.config.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - "scripts/build-showcase.mjs"
      - "documents/src/renderers.mjs"
      - "panda.config.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tka-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build showcase from canonical Panda tokens
        run: npm run showcase:build
      - name: Verify generated output
        run: |
          test -s site/index.html
          ! grep -Eq '__[A-Z0-9_]+__' site/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
