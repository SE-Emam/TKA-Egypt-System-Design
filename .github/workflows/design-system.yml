name: Design system quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install document rendering tools
        run: |
          if command -v soffice >/dev/null && command -v pdfinfo >/dev/null && command -v pdftotext >/dev/null && command -v pdftoppm >/dev/null && command -v fc-match >/dev/null && fc-match "DejaVu Sans" | grep -qi "DejaVu Sans"; then
            echo "Office, Poppler, and DejaVu tools are already available; skipping package installation."
          else
            if ! sudo timeout 180s apt-get install --yes --no-install-recommends fonts-dejavu-core libreoffice-writer libreoffice-impress poppler-utils; then
              sudo timeout 90s apt-get update
              sudo timeout 180s apt-get install --yes --no-install-recommends fonts-dejavu-core libreoffice-writer libreoffice-impress poppler-utils
            fi
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run design-system gates
        run: npm run check
